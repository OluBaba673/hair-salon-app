<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Olu Hair Place</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="site site-compact">
  <div class="site-inner">
    <p class="eyebrow">Olu Hair Place</p>
    <h1>Appointments</h1>
  </div>
  <svg class="header-wave" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,32 C240,64 480,0 720,16 C960,32 1200,64 1440,32 L1440,60 L0,60 Z"></path>
  </svg>
</header>

<main>
  <div id="messageBox"></div>

  <div id="loginCard" class="card">
    <label for="passwordInput">Admin password</label>
    <input type="password" id="passwordInput" />
    <button class="primary" id="loginBtn">Log in</button>
  </div>

  <div id="bookingsCard" class="card hidden">
    <div class="admin-toolbar">
      <strong>All appointments</strong>
      <button class="cancel-btn" id="logoutBtn">Log out</button>
    </div>
    <div class="table-scroll">
      <table class="bookings">
        <thead>
          <tr>
            <th>Status</th>
            <th>Date</th>
            <th>Time</th>
            <th>Service</th>
            <th>Client</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Notes</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="bookingsBody"></tbody>
      </table>
    </div>
  </div>
</main>

<footer class="site-footer">
  <a class="admin-link" href="index.html">Back to booking page</a>
</footer>

<script src="admin.js"></script>
</body>
</html>
